name: QA

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run CoDiscover QA
        run: python tests/run_qa.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/chatgpt-mcp/package-lock.json

      - name: Install ChatGPT App dependencies
        working-directory: apps/chatgpt-mcp
        run: npm ci

      - name: Test ChatGPT App logic
        working-directory: apps/chatgpt-mcp
        run: npm test

      - name: Smoke test MCP transport
        working-directory: apps/chatgpt-mcp
        run: npm run smoke
